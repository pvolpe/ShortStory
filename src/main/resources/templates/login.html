<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in – Short Stories</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>
<main class="auth">
    <h1 class="brand">Short Stories</h1>
    <form class="auth-card" method="post" th:action="@{/login}">
        <h2>Log in</h2>

        <p class="notice" th:if="${param.registered}">Account created. You can log in now.</p>
        <p class="notice" th:if="${param.logout}">You have been logged out.</p>
        <p class="error" th:if="${param.error}">Wrong email or password.</p>

        <label>Email
            <input type="email" name="email" autocomplete="email" required autofocus>
        </label>
        <label>Password
            <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button class="btn btn-primary btn-block" type="submit">Log in</button>
        <p class="switch">No account yet? <a th:href="@{/signup}">Sign up</a></p>
    </form>
</main>
</body>
</html>
